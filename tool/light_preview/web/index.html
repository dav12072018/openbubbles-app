<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive local UI demo of OpenBubbles Light. Sample data only; no real messages are sent.">
  <meta name="theme-color" content="#000000">
  <title>OpenBubbles Light — local demo</title>
</head>
<body>
  <script>
    (async () => {
      // Retire only this demo's old Flutter worker before loading fresh assets.
      const scope = new URL('./', document.baseURI);
      const workerUrl = new URL('flutter_service_worker.js', scope);
      const isOldFlutterWorker = worker => {
        if (!worker) return false;
        const url = new URL(worker.scriptURL);
        return url.origin === workerUrl.origin && url.pathname === workerUrl.pathname;
      };
      try {
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.getRegistration(scope.href);
          if (registration && registration.scope === scope.href &&
              [registration.active, registration.waiting, registration.installing].some(isOldFlutterWorker)) {
            const wasControlled = isOldFlutterWorker(navigator.serviceWorker.controller);
            if (await registration.unregister() && wasControlled) {
              // Unregistration persists; the next load cannot enter this branch again.
              location.reload();
              return;
            }
          }
        }
      } catch (error) {
        console.warn('Could not retire the old local demo worker.', error);
      }
      const bootstrap = document.createElement('script');
      bootstrap.src = new URL('flutter_bootstrap.js', scope).href;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
